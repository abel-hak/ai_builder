<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="data:," />
    <title>Forge.ai — Streaming AI tools for code, content & language</title>
    <meta name="description" content="Live AI tool suite: code review, content studio, sentiment analysis, and translation. Streaming via Supabase Edge Functions and Groq. Built by Abel Erduno Hakenso." />
    <meta name="author" content="Abel Erduno Hakenso" />

    <!-- Preconnect to font CDN to eliminate DNS/TLS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts (display swap so text renders immediately) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@300;400;500;600;700&display=swap" />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:title" content="Forge.ai — Streaming AI tools" />
    <meta property="og:description" content="Code review, content studio, sentiment, and translation — live streaming demos on Supabase + Groq." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
  </head>

  <body>
    <script>
      // Prevent flash of wrong theme (runs before React)
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
